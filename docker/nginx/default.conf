upstream academix_api {
  server api:3000;
}

upstream academix_web {
  server web:3000;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;

  # Keep common proxy headers for app visibility and audit logs.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ {
    proxy_http_version 1.1;
    proxy_pass http://academix_api;
  }

  location / {
    proxy_http_version 1.1;
    proxy_pass http://academix_web;
  }
}
